version: '3.8'

services:
  neo4j:
    image: neo4j:5.26  # Recommended stable version for GraphRAG
    container_name: neo4j-graphrag
    ports:
      - "7474:7474"  # HTTP Web Interface / Neo4j Browser
      - "7687:7687"  # Bolt protocol (used by your LangChain code)
    environment:
      - NEO4J_AUTH=neo4j/GraphRAG@123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_plugins:/plugins  # Ensures plugins download and cache correctly

volumes:
  neo4j_data:
  neo4j_plugins:
